[package]
name = "rusty_h265-accel"
version = "0.6.2"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Remade-With-Rust/rusty_h265"
description = "SIMD kernels for the rusty_h265 HEVC decoder: the one crate allowed `unsafe`, behind a runtime-dispatched seam."

# NOTE(uefi-player vendor): vendored from crates.io 0.6.2 + no_std port. See
# ../rusty_h265/VENDOR.md. `std` (default on) preserves upstream behavior
# exactly; `default-features = false` is the firmware shape: no_std, scalar
# twins + dispatchers always, SIMD twins when `simd` is on. `simd` without
# `std` is supported: env knobs read as unset (shipped defaults), arch
# intrinsics come from `core`, and the runtime ISA is firmware-gated
# (`force_isa` / `force_scalar` pushed before first decode — never a second
# CPUID/XCR0 probe here).

[features]
default = ["std", "simd"]
std = []
simd = []
census = []

[lib]
name = "rusty_h265_accel"
path = "src/lib.rs"

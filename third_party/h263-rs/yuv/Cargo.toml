[package]
name = "h263-rs-yuv"
version = "0.1.0"
authors = ["Mike Welsh <mwelsh@gmail.com>"]
edition = "2018"
license = "MIT OR Apache-2.0"

# NOTE(uefi-player vendor): vendored from ruffle-rs/h263-rs + no_std port.
# See ../VENDOR.md. `std` (default on) preserves upstream behavior exactly
# (wide SIMD color conversion, always on like upstream);
# `default-features = false` is the firmware shape: no_std + alloc, scalar
# twin only; add `simd` for the firmware SIMD shape (wide without `std` —
# wide itself is `#![no_std]`, runtime-gated by `set_simd_enabled`).

[features]
default = ["std"]
# `simd`: wide integer kernels without `std` (wide itself is `#![no_std]`; its
# `std` feature only speeds up float `sqrt`, which these kernels never touch —
# see VENDOR.md). On => SIMD fast path under the runtime `simd_enabled` switch
# (single-bit `[accel]` backer, scalar=off/else=on; defaults ON under `std`
# like upstream, OFF under no_std fail-closed until firmware opts in).
# Off => scalar twin only.
simd = ["dep:wide"]
# Upstream shape: SIMD on + wide's float fallback. `bytemuck` stays on in both
# shapes (zero default features, core-only slicing casts).
std = ["simd", "wide/std"]

[dependencies]
wide = { version = "1.7.1", default-features = false, optional = true }
bytemuck = { version = "1.13.1", default-features = false }

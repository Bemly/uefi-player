[package]
name = "h263-rs-deblock"
version = "0.1.0"
authors = ["TÖRÖK Attila <torokati44@gmail.com>"]
edition = "2018"
license = "MIT OR Apache-2.0"

# NOTE(uefi-player vendor): vendored from ruffle-rs/h263-rs + no_std port (scalar).
# See ../VENDOR.md. `std` (default on) preserves upstream behavior exactly
# (wide SIMD fast paths); `default-features = false` is the firmware shape:
# no_std + alloc, every edge filtered by the scalar kernel.
# `simd` without `std` is NOT supported (same doctrine as rusty_h265).

[features]
default = ["std"]
# Wide SIMD fast paths + itertools zipping for the 8-row parallel loop.
# Off => scalar twin covering the identical edge positions. `itertools` keeps
# `use_alloc` as its baseline so the no_std build stays compiling; `use_std`
# is only layered on top for the std shape.
std = ["wide/std", "itertools/use_std"]

[dependencies]
wide = { version = "1.7.1", default-features = false, optional = true }
itertools = { version = "0.15.0", default-features = false, features = ["use_alloc"], optional = true }

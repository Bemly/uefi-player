[package]
name = "player-config-gui"
version = "0.1.0"
edition = "2021"
description = "player.toml 跨平台可视化编辑器（host 工具，与 UEFI 固件包独立）"

# 轮子选择（见根 AGENTS.md「轮子优先」）：
# - eframe 0.35 + egui 0.35 + wgpu 29：egui_glass 官方测过的组合，eframe 的 `wgpu`
#   特性即 wgpu 驱动（glow 不被 egui_glass 支持，故强制 Renderer::Wgpu）。
# - egui_glass 0.1.5：液态玻璃面板/按钮（crates.io 现货，不自研模糊管线）。
# - rfd 0.17：原生打开/保存对话框（不手写平台 dialog）。
# - toml 1 + serde：与固件侧 config.rs 同 schema 解析/回写。
# - egui-wgpu 0.35：只为存 RenderState（深浅色切换时重传 backdrop），版本与 eframe 拉齐。
# - rust-i18n 4：400 万下载的现货（YAML 编译期进二进制，t! + set_locale）。
#   对比过 fluent（Mozilla 那套要 unic-langid + ftl，杀鸡用牛刀），故不用。
# - CJK 字体：egui 默认字体无中文字形。搜过系统字体方案（各平台 ttc 路径不一、
#   ab_glyph 对 ttc 支持存疑），故用缝合像素 fusion-pixel 10px proportional 简中
#   TTF 原包全量文件（`assets/fusion-pixel-10px-proportional-zh_hans.ttf` 上游
#   v2026.10.16，约 4MB），`include_bytes!` 编进二进制。字体禁止子集化
#   （根 AGENTS.md 有令：子集漏字只能事后补，体积换完整）。
# - 转码页编码器（host std，无 no_std 约束；固件侧不受影响）：
#   avc/hevc 编码 + avc 解码走硬解（用户拍板 2026-10-22）：mac 同门
#   `shiguredo_video_toolbox 2026.1`（与动态背景同轮子，VideoToolbox 编码
#   `Encoder` + 解码 `Decoder`，I420/NV12 平面直传）/ Win-Linux `gpu-video 0.4`
#   （Vulkan Video `BytesDecoder` NV12 回读 + `BytesEncoderH264/H265`，轮子 verdict
#   见 `docs/transcode.md`；`default-features = false` 关 wgpu 互操作——经 CPU 侧
#   NV12 搬运上下屏，无版本耦合）；CPU 链（`less-avc`/`oxideav-h265`/rusty 系）
#   保留为失败兜底，不断转码。
#   `less-avc 0.1`（strawlab，MIT/Apache-2.0，纯 Rust H.264 baseline 编码器；
#   AVC CPU 兜底；固件树里已有同版本，见根 Cargo.toml，但固件只借名未用）；
#   `shiguredo_mp4 2026.5`（与固件同版本同用法：demux 复用 + `Mp4FileMuxer`
#   打包 avc1/hvc1/vp09，读写同轮子，固件回读零风险；不另选 oxideav-mp4，
#   免跨解析器口径差）；
#   `oxideav-theora 0.0.12`（与固件 pin 同版：`FrameEncoder` + registry
#   `make_encoder`，`encoder` 特性门在上游是无条件编译，crates.io 默认特性即有；
#   `ogg 0.9`（RustAudio，BSD-3，1100 万下载，OggS 组包）装 theora 三头+数据包；
#   `oxideav-h263 0.0.10`（MIT，`H263StreamEncoder` + `H263EncoderOptions`）；
#   `oxideav-h265 0.0.15`（MIT，`H265Encoder` inter/intra/pcm + `make_encoder`；
#   现为 HEVC CPU 兜底；固件解码用 rusty_h265，跨箱 roundtrip 靠 host 测试锁死）；
#   `oxideav-mpeg12video 0.0.13`（MIT，MPEG-1/2 encoder + runtime；
#   固件解码用 filmcraft-mpeg2v，跨箱 roundtrip 同上）；
#   `rusty_vp9 0.1`（Remade-With-Rust，Apache-2.0，零依赖，`Vp9Encoder` +
#   `Vp9EncoderConfig{crf/lag/speed}`；固件解码用 vp9dec，跨箱 roundtrip 同上）；
#   `oxideav-core 0.1`（MIT，OxideAV 四家 encoder 的 `CodecParameters`/`Frame`/
#   `Packet` 公共类型，已在 oxideav-theora 传递依赖里）；
#   `image 0.25`（大轮子：静帧源 png/jpeg 解码 + `Triangle` 缩放到 1920x1080 +
#   QOI 编码出 qois；手写三份不如一个现货，见 transcode.rs 头注释）。
#   解码复用：mp4 源走 shiguredo_mp4 + avc 硬解优先（mac VT Baseline 门控/
#   Vulkan FrameSorter 保序；失败回退 rusty_h264-decoder 0.16）+ rusty_h265 0.6.2/
#   vp9dec 0.1.1（与固件同版本；h263/mpeg2v 源暂只走裸流直通，后继再接）。
# - 本地时间戳命名（host std，转码输出默认名 yymmddhhmmss；会话级，不落盘）：
#   `chrono 0.4`（标准轮子，`Local::now().format("%y%m%d%H%M%S")`；搜过手写
#   `libc::localtime`（平台相关时区坑）与系统 `date` 子进程（测试不可控），故用现货。
# - 列表拖拽排序（host std，播放列表/壁纸画廊行重排；固件侧不受影响）：
#   `egui_dnd 0.16`（lucasmerlin/hello_egui，MIT，
#   crates.io 现货，持续维护，MSRV >= 1.80 < 本仓 1.92；
#   host-only，no_std-irrelevant，固件零依赖）。
#   轮子 verdict：SPEC 写 `egui_dnd 0.18`，但实测 `cargo tree` 显示
#   0.18 拉 `egui 0.37`，与本仓 `egui 0.35` 双版本冲突（`egui::Ui`
#   类型不通，编译不过）；`egui_dnd 0.16` 拉的正是 `egui 0.35`，
#   同轮同用法，故用 `0.16`（caret），属 verdict 的版本 skew fallback。
#   搜过手写上/下按钮（零依赖单步挪，已保留为兜底）与
#   `egui_extras` 表格排序器（要拖入整套表格件，与玻璃行不搭，故不用）。
#   用法：`dnd(ui, id).with_animation_time(0.0).show(下标 id 行, …)`，
#   落点 `update_vec` 写回（重复路径靠下标 id 区分，见 `playlist.rs` 头注释）。
# - 动态背景 GPU 转换版（host 全平台，固件侧不受影响；CPU 零像素运算，用户拍板）：
#   解码仍走硬解（mac `shiguredo_video_toolbox 2026.1` VideoToolbox /
#   Win/Linux `gpu-video 0.4` Vulkan Video `BytesDecoder`，MSRV 1.88/1.85 均 < 本仓 1.92）。
#   worker 只传 NV12（Y + 交错 UV，不做 BT.601，不转 RGBA）；UI 侧 NV12 经 DMA 直传
#   两张 R8/RG GPU 纹理，YUV→RGBA 在自研 20 行 WGSL 全屏三角里算（与转码页
#   `codecs::yuv420_to_rgba` 同 BT.601 全范围口径，(frame)逐字节一致由单测锁死）。
#   CPU 只剩压缩包搬运 + `write_texture` 提交，零像素数学；上传量 NV12 为 RGBA 的 3/8。
#   显示封顶 15fps（与壁纸默认 fps 同档）+ 失焦停推（`viewport.focused` 门），
#   重绘量为旧 60fps 版的 1/4；后台队列深度 4（约 5.6MB 背压）。
#   真零拷贝（解码显存直显、零上传）走不通，故不用：VideoToolbox 侧轮子只给
#   `y_plane/uv_plane` CPU 切片（`PixelFormat` 仅 I420/Nv12，无 RGBA 输出，
#   亦无 CVPixelBuffer 裸句柄可做 IOSurface→Metal→wgpu 导入，改轮子等于 fork）；
#   Vulkan 侧 `decode_to_wgpu_textures` 产的是轮子自建 Vulkan device 的纹理
#   （纵与本仓 wgpu 29 同大版本，也跨不过 device，必须走外部内存导入，
#   无现货轮子）。`default-features = false` 照旧（不要轮子的 wgpu 互操作，
#   本仓经自有 RenderState 直写 wgpu，无版本耦合）。
#   玻璃穿透：视频只画在 `live.run` 闭包内（与静态 twin 图同槽位、同右移矩形，
#   native id 在 `LiveBackdrop::new` 之后登记、twin 自动镜像）；绝不在 live 外
#   另铺全屏图（旧 native 吃面板坑即此，未深究但已规避）。`set_backdrop` 仍只
#   服务静态兜底（缺片/首帧未到/硬解失败 → 静态 twin 图 → 纯色）。
#   静态 `assets/bg.png`（1280x720，约 600KB）保留为兜底。
#   搜过不用：`egui-video 0.9`（ffmpeg6/7 + SDL2，重 C 依赖）；
#   `egui-sharkplayer 0.5`（libmpv2 + 要系统库）；`ffmpeg-next 9`
#   （系统动态库，brew 升版即断 ABI）；`moq-video`（MoQ 网络流，大炮打蚊子，
#   且 render 要 wgpu 30 与本仓 29 冲突）；内置 ffmpeg 二进制
#   （每平台 30~80MB，无新能力）。
[dependencies]
egui_dnd = "0.16"
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.35"
egui-wgpu = "0.35"
egui_glass = "0.1.5"
rust-i18n = "4"
rfd = "0.17"
image = "0.25"
less-avc = "0.1"
shiguredo_mp4 = "2026.5"
rusty_h264-decoder = "0.16"
rusty_h265 = "0.6.2"
vp9dec = "0.1.1"
oxideav-theora = "0.0.12"
oxideav-core = "0.1"
rusty_vp9 = "0.1"
oxideav-h265 = "0.0.15"
oxideav-h263 = "0.0.10"
oxideav-mpeg12video = "0.0.13"
ogg = "0.9"
qoi = "0.4"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
toml = "1"

[target.'cfg(target_os = "macos")'.dependencies]
shiguredo_video_toolbox = "2026.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
gpu-video = { version = "0.4", default-features = false }

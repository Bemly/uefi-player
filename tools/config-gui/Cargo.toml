[package]
name = "player-config-gui"
version = "0.1.0"
edition = "2021"
description = "player.toml 跨平台可视化编辑器（host 工具，与 UEFI 固件包独立）"

# 轮子选择（见根 AGENTS.md「轮子优先」）：
# - eframe 0.35 + egui 0.35 + wgpu 29：egui_glass 官方测过的组合，eframe 的 `wgpu`
#   特性即 wgpu 驱动（glow 不被 egui_glass 支持，故强制 Renderer::Wgpu）。
# - egui_glass 0.1.5：液态玻璃面板/按钮（crates.io 现货，不自研模糊管线）。
# - rfd 0.17：原生打开/保存对话框（不手写平台 dialog）。
# - toml 1 + serde：与固件侧 config.rs 同 schema 解析/回写。
# - egui-wgpu 0.35：只为存 RenderState（深浅色切换时重传 backdrop），版本与 eframe 拉齐。
# - rust-i18n 4：400 万下载的现货（YAML 编译期进二进制，t! + set_locale）。
#   对比过 fluent（Mozilla 那套要 unic-langid + ftl，杀鸡用牛刀），故不用。
# - CJK 字体：egui 默认字体无中文字形。搜过系统字体方案（各平台 ttc 路径不一、
#   ab_glyph 对 ttc 支持存疑），故用缝合像素 fusion-pixel 10px proportional 简中
#   TTF 原包全量文件（`assets/fusion-pixel-10px-proportional-zh_hans.ttf` 上游
#   v2026.10.16，约 4MB），`include_bytes!` 编进二进制。字体禁止子集化
#   （根 AGENTS.md 有令：子集漏字只能事后补，体积换完整）。
[dependencies]
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.35"
egui-wgpu = "0.35"
egui_glass = "0.1.5"
rust-i18n = "4"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "1"

# 30-probe.toml：QEMU 黑盒矩阵分组（`matrix/` 目录，按用例前缀分组，合并后等价原 `matrix.toml`）。
# 共 7 cases，单文件 ≤1000 行（AGENTS 口径）。新增 case 按前缀落对应文件，并写 `covers`。

[[case]]
name = "diag-keys"
covers = ["src/diag/get_cpu_info.rs", "src/diag/mp_service.rs", "src/diag/avx_checker.rs"]
timeout_sec = 240
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "1", wait_for = ["menu: ready"], wait_after = 8 },
  { send = "x", wait_after = 3 },
  { send = "4", wait_after = 8 },
  { send = "x", wait_after = 3 },
  { send = "7", wait_for = ["menu: ready"], wait_after = 5 },
]
expect = ["Total number of logic processors:", "Starting Multi-Processor", "AVX is "]

# uefi-async 自举：进纯播放器菜单按 a，nano（join/timeout/timer/pacer）+
# dynamic（spawn/cancel/retune）两条堆线必须 PASS。
[[case]]
name = "async-exec"
covers = ["src/diag/async_exec.rs"]
timeout_sec = 240
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "a", wait_for = ["menu: ready"], wait_after = 8 },
]
expect = ["async-exec: nano ok", "async-exec: dynamic ok", "async-exec: PASS"]

# 执行器线单档：nano 只跑单核线（无 dynamic 行），dynamic 只跑多核线。
[[case]]
name = "async-exec-nano"
covers = ["src/diag/async_exec.rs"]
timeout_sec = 240
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
[async]
executor = "nano"
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "a", wait_for = ["menu: ready"], wait_after = 8 },
]
expect = ["async-exec: nano ok", "async-exec: PASS"]

[[case]]
name = "async-exec-dynamic"
covers = ["src/diag/async_exec.rs"]
timeout_sec = 240
config = """

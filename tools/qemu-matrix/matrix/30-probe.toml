expect = ["async-exec: dynamic ok", "async-exec: PASS"]

# uefi-input2 交互探测：进菜单按 b（等键 10s），矩阵发 z，
# Ex 协议必须回显键码 + 修饰/锁定状态，最后 PASS。
[[case]]
name = "input2-probe"
covers = ["src/diag/input2_probe.rs"]
timeout_sec = 240
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "b", wait_for = ["menu: ready"], wait_after = 3 },
  { send = "z", wait_for = ["input2: waiting"], wait_after = 5 },
]
expect = ["input2: key=", "input2: PASS"]

# AVC 解码探针：内嵌 baseline 小样片在固件里实解，帧数/几何/校验和 + PASS 全走串口。
# 按键 `c`（菜单诊断项；弹窗侧 p/f/s/r/q 已占，c 只在纯播放器菜单里有效）。
[[case]]
name = "avc-probe"
covers = ["src/diag/avc_probe.rs", "src/diag/data/avc_probe_baseline.264"]
timeout_sec = 240
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "c", wait_for = ["menu: ready"], wait_after = 5 },
]
expect = ["avc: decoded 4 frames", "avc: PASS"]

# HEVC 解码探针：内嵌 Main 小样片在固件里实解，帧数/几何/校验和 + PASS 全走串口。
# 按键 `d`（菜单诊断项；弹窗侧 p/f/s/r/q 已占，d 只在纯播放器菜单里有效）。
[[case]]
name = "hevc-probe"
covers = ["src/diag/hevc_probe.rs", "src/diag/data/hevc_probe_main.265"]
timeout_sec = 240
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
"""
boot_expect = ["cfg: version=1", "accel: decode simd hevc=on vp9=on h263=on h264=off mpeg2v=on theora=on", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "d", wait_for = ["menu: ready"], wait_after = 5 },
]
expect = ["hevc: decoded 10 frames", "hevc: PASS"]

# 弹窗导航：开弹窗 → q 回壁纸 → 再开（open 第二遍 = 待机循环没卡死）。

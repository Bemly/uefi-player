# 解码表（`[decode.<fmt>]`，统一控制平面）：每格式独立四键
#（threads bsp_only/all + zero_copy/streaming 布尔 + buffers 0=跟随 tune.window/1-32 显式）。
# 有状态软解码（hevc/avc/vp9/h263/mpeg2v/theora 单核顺序状态机）threads=all 解析但
# 警告并驻 bsp_only（qois/raw 无表，all 即时生效）；zero_copy/streaming/buffers(window)
# 全格式可行。断言：解析（`decode: fmt=` 行）+ 回退警告（`threads all deferred` 行）
# + 上传路 path 行 + soak 保活，不断言画质。
[[case]]
name = "video-decode-hevc"
covers = ["src/video/decoder", "src/video.rs", "src/diag/data/hevc_probe_main.265"]
timeout_sec = 180
needs_hevcvideo = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
format = "hevc"
feed = "clip"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
[decode.hevc]
threads = "all"
zero_copy = true
streaming = true
buffers = 8
"""
boot_expect = ["cfg: version=1", "play.fmt=Hevc", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "0", wait_for = ["menu: ready"], wait_after = 5 },
]
expect = ["video: fmt=Hevc", "decode: fmt=Hevc", "decode: Hevc threads all deferred", "play: path=direct_loop"]
soak_sec = 10


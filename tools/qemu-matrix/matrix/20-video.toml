# 播放列表循环（loop_list）：6 项裸片源各自动检测（qois/hevc/ivf/h263/m2v/ogv，
# 同镜像多 needs_* 即多文件），逐项 `playlist: item` + `video: fmt=` 不断，
# 播完回绕（loop_list 语义）；`play: path=` + soak 保活同旧口径。
[[case]]
name = "playlist-list-loop"
covers = ["src/video/", "src/video/play.rs", "src/config/types.rs", "usb_reports/1080p/video.qois", "src/diag/data/hevc_probe_main.265", "src/diag/data/vp9_probe.ivf", "src/diag/data/video.h263", "src/diag/data/video.m2v", "src/diag/data/video.ogv"]
timeout_sec = 240
needs_video = true
needs_hevcvideo = true
needs_vp9video = true
needs_h263video = true
needs_mpeg2vvideo = true
needs_theoravideo = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[playlist]
loop = "loop_list"
[[playlist.items]]
path = "1080p/video.qois"
[[playlist.items]]
path = "1080p/video.hevc"
[[playlist.items]]
path = "1080p/video.ivf"
[[playlist.items]]
path = "1080p/video.h263"
[[playlist.items]]
path = "1080p/video.m2v"
[[playlist.items]]
path = "1080p/video.ogv"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "0", wait_for = ["menu: ready"], wait_after = 5 },
]
expect = ["playlist: items=6 loop=loop_list", "playlist: item 1/6 path=1080p/video.qois", "playlist: item 6/6 path=1080p/video.ogv", "video: fmt=Qois", "video: fmt=Hevc", "video: fmt=Vp9", "video: fmt=H263", "video: fmt=Mpeg2v", "video: fmt=Theora", "play: path=direct_loop"]
soak_sec = 15

# 播放列表单曲循环（loop_single）：mp4 容器探针（avc 轨，石雨堂拆 avcC → Annex-B）
# 即容器路证明；同一项反复出现（count x2）即“重播当前项”语义。
[[case]]
name = "playlist-loop-single"
covers = ["src/video/", "src/video/play.rs", "src/config/types.rs", "src/diag/data/video-avc.mp4"]
timeout_sec = 180
needs_avcvideo = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[playlist]
loop = "loop_single"
[[playlist.items]]
path = "1080p/video.mp4"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "0", wait_for = ["menu: ready"], wait_after = 5 },
]
expect = ["playlist: items=1 loop=loop_single", { pat = "playlist: item 1/1 path=1080p/video.mp4", count = 2 }, "video: fmt=Avc", "play: path=direct_loop"]
soak_sec = 10

# 播放列表播一次（once）：mp4 hev 轨（容器探针第二代表，hvcC → Annex-B）+
# qois 两项走完即停（once 语义）；不断言播后落点，只验两项都播出。
[[case]]
name = "playlist-once"
covers = ["src/video/", "src/video/play.rs", "src/config/types.rs", "src/diag/data/video-hevc.mp4", "usb_reports/1080p/video.qois"]
timeout_sec = 180
needs_hevcmp4video = true
needs_video = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[playlist]
loop = "once"
[[playlist.items]]
path = "1080p/video.mp4"
[[playlist.items]]
path = "1080p/video.qois"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "0", wait_for = ["menu: ready"], wait_after = 5 },
]
expect = ["playlist: items=2 loop=once", "playlist: item 1/2 path=1080p/video.mp4", "playlist: item 2/2 path=1080p/video.qois", "video: fmt=Hevc", "video: fmt=Qois", "play: path=direct_loop"]
soak_sec = 10

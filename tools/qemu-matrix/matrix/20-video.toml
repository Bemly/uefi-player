# 扫描制播放（P6）：旧 `playlist-list-loop`/`playlist-loop-single`/`playlist-once`
# 三例（播片列表语义）已删除，改由 TUI 扫描制播放覆盖（见 `70-ptui.toml` 的
# `ptui-play-scan`：根目录片源，进 TUI 播放页断扫描行 + 播 + soak）。
# 本文件余下 9 cases 均为单项 `[[playlist.items]]`（根目录 `video.*` 路径）。

# 显示适配 fit（默认档）：[display] fit=fit bar=black，qois 单项循环（抄 video-nano 最小形）；
# clip 起播打 `display: fit=fit bar=000000 ...` 标记（播后 expect 断言前缀，boot_expect 只保开机），soak 保活。
[[case]]
name = "video-display-fit"
covers = ["src/graphics/scale.rs", "src/config/display.rs", "src/video/", "usb_reports/1080p/video.qois"]
timeout_sec = 180
needs_video = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[display]
fit = "fit"
bar = "black"
[playlist]
loop = "loop_list"
[[playlist.items]]
path = "video.qois"
[wallpaper]
enable = false
[schedule]
backend = "nano"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "p", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "1", wait_for = ["ptui: page=home"], wait_after = 2 },
  { send = "1", wait_for = ["ptui: page=play"], wait_after = 5 },
]
expect = ["play: path=nano_pump", "playlist: items=1 loop=loop_list", "ptui: play 0 path=video.qois", "display: fit=fit bar=000000"]
soak_sec = 15


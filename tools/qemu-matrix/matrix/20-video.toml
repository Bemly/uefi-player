# 20-video.toml：QEMU 黑盒矩阵分组（`matrix/` 目录，按用例前缀分组，合并后等价原 `matrix.toml`）。
# 共 8 cases（播放 5 + 播放列表 3），单文件 ≤1000 行（AGENTS 口径）。新增 case 按前缀落对应文件（解码/槽位类进 60-decode.toml），并写 `covers`。
#
# 播放列表模型（`[playlist] loop` + `[[playlist.items]] path`，见 `docs/player.md`）：
# 固件不再读 `[play] format`（旧键残留按 serde 默认忽略），每项按路径自动检测
# （qois 后缀 / frameNNNN.raw 目录扫描 / mp4 容器探针 hevc>avc>vp9 / hevc/.265 /
# ivf / h263 / m2v / ogv，探针失败该项 `playlist: skip` 警告跳过，不断播）。
# 旧单格式 case（video-raw/hevc/vp9/h263/mpeg2v/theora/avc/hevc-mp4/vp9-mp4）与
# 旧供片档位 case（video-feed-* 七例，feed 收敛为全局默认 + per-codec fetch 覆盖）
# 已删除，覆盖收敛到本文件 3 个播放列表 case（多文件夹具复用既有 needs_* 标志，
# 同一 case 置多个标志即同镜像多片源，无新 runner 标志）与 60-decode.toml 的
# 播放列表化用例；mp4 容器探针以 avc 轨（loop-single）+ hev 轨（once）两代表覆盖。

[[case]]
name = "video-mp"
covers = ["src/video.rs", "src/video/", "usb_reports/1080p/video.qois"]
timeout_sec = 180
needs_video = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[playlist]
loop = "loop_list"
[[playlist.items]]
path = "1080p/video.qois"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "all"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "0", wait_for = ["menu: ready"], wait_after = 5 },
]
expect = ["play: path=mp_draw", "playlist: items=1 loop=loop_list", "playlist: item 1/1 path=1080p/video.qois"]
soak_sec = 20


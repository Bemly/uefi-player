# 20-video.toml：QEMU 黑盒矩阵分组（`matrix/` 目录，按用例前缀分组，合并后等价原 `matrix.toml`）。
# 共 27 cases，单文件 ≤1000 行（AGENTS 口径）。新增 case 按前缀落对应文件，并写 `covers`。

[[case]]
name = "video-mp"
covers = ["src/video.rs", "src/video/", "usb_reports/1080p/video.qois"]
timeout_sec = 180
needs_video = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "all"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "0", wait_for = ["menu: ready"], wait_after = 5 },
]
expect = ["play: path=mp_draw"]
soak_sec = 20


# 20-video.toml：QEMU 黑盒矩阵分组（`matrix/` 目录，按用例前缀分组，合并后等价原 `matrix.toml`）。
# 共 9 cases（播放 5 + 显示 4），单文件 ≤1000 行（AGENTS 口径）。新增 case 按前缀落对应文件（解码/槽位/crew-roles 类进 60-decode.toml，TUI 类进 70-ptui.toml），并写 `covers`。
#
# 播放列表模型（`[playlist] loop` + `[[playlist.items]] path`，见 `docs/player.md`）：
# 固件不再读 `[play] format`（旧键残留按 serde 默认忽略），每项按路径自动检测
# （qois 后缀 / raws 单文件 / frameNNNN.raw 目录扫描 / mp4 容器探针 hevc>avc>vp9 / hevc/.265 /
# ivf / h263 / m2v / ogv，探针失败该项 `playlist: skip` 警告跳过，不断播）。
# 起播键流（TUI 外壳口径）：p → TUI 首页 `1` 进播放页 → 数字 `1` 播首项
#（旧弹窗 → p → 纯播放器菜单 → 0 已随外壳退役；`playlist: items=` 为开机行保留，
# 逐项 `playlist: item` 行只在旧 `video_run` 管线打印，TUI `play_path` 改断
# `ptui: play <i> path=` + `play: path=` 管线行）。
# 供片 convention（P6）：播片放镜像根目录（`video.*`；`1080p/` 硬编码已删除；
# raw 目录扫描 `1080p/frameNNNN.raw` 与 `720p/` 几何目录保留，壁纸 `wallpaper/` 不动）。
# 旧单格式 case（video-raw/hevc/vp9/h263/mpeg2v/theora/avc/hevc-mp4/vp9-mp4）与
# 旧供片档位 case（video-feed-* 七例）已删除，覆盖收敛到本文件单项播放列表 case
# 与 60-decode.toml 的播放列表化用例；旧三播放列表语义 case
#（playlist-list-loop/loop-single/once）已删除，改由 `70-ptui.toml` 的
# `ptui-play-scan`（TUI 扫描制播放）覆盖。

[[case]]
name = "video-mp"
covers = ["src/video.rs", "src/video/", "usb_reports/1080p/video.qois"]
timeout_sec = 180
needs_video = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[playlist]
loop = "loop_list"
[[playlist.items]]
path = "video.qois"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "all"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "p", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "1", wait_for = ["ptui: page=home"], wait_after = 2 },
  { send = "1", wait_for = ["ptui: page=play"], wait_after = 5 },
]
expect = ["play: path=mp_draw", "playlist: items=1 loop=loop_list", "ptui: play 0 path=video.qois"]
soak_sec = 20


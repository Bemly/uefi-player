# 供片模式（`[play] feed` 五档，只切 `Clip` 内部拿帧方式，上传路零改）：
# clip 全预解码现路 / staged qois 显式三段 / stream 窗口边播边解 /
# zero_copy 单缓冲即时解码 / single 每帧重读重解码零缓存。断言串口 `video: feed=`
# （生效值：`[decode.<fmt>] fetch` 显式覆盖本格式时取覆盖值，见解码表头）+
# 上传路 path 行 + soak 保活。qois 五档 × stream/single hevc 代表格式
# （hevc 其余供片在结构上等价 clip，见固件 `FeedMode` 注释；全组合不铺，避 5×8 膨胀）。
# 上传路沿用 direct 单核整轮（供片不管上传，path 行与 video-raw 同形）。
[[case]]
name = "video-feed-clip"
covers = ["src/video/decoder", "src/video.rs", "usb_reports/1080p/video.qois"]
timeout_sec = 180
needs_video = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
feed = "clip"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
"""
boot_expect = ["cfg: version=1", "play.feed=Clip", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "0", wait_for = ["menu: ready"], wait_after = 5 },
]
expect = ["video: feed=clip", "play: path=direct_loop"]
soak_sec = 15


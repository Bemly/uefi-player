# Linux 内核对发现：只验列出来（标题 + <linux> 标记进串口），不真起
#（假内核不是有效 PE，起了也是 INVALID_IMAGE，不浪费时间）。
[[case]]
name = "boot-linux-detect"
covers = ["src/boot/", "patches/", "third_party/sprout"]
ovmf = "release"
timeout_sec = 180
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"

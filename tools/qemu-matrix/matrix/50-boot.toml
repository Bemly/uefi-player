# OpenCore 链式接力：第二盘只有 OpenCore.efi（我们的 efi 改名），
# 按 0 直接交权，第二遍 cfg + 待机证明跨盘 DevicePath + 跨盘读都通了。
# 不扫通用 BOOTX64.EFI（那可能是我们自己，会自举死循环），只认固定路径。
[[case]]
name = "boot-macos"
covers = ["src/boot/", "patches/", "third_party/sprout"]
ovmf = "release"
timeout_sec = 300
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
[schedule]

# 50-boot.toml：QEMU 黑盒矩阵分组（`matrix/` 目录，按用例前缀分组，合并后等价原 `matrix.toml`）。
# 共 12 cases，单文件 ≤1000 行（AGENTS 口径）。新增 case 按前缀落对应文件，并写 `covers`。

[[case]]
name = "boot-chainload"
covers = ["src/boot/", "patches/", "third_party/sprout"]
ovmf = "release"
timeout_sec = 300
needs_chainload = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "0", wait_for = ["boot: 1 entries"], wait_after = 5 },
]
expect = ["boot: starting image", { pat = "cfg: version=1", count = 2 }, { pat = "idle: ready", count = 2 }]

# BLS 组内排序：同 sort-key 下版本号大的在前（10.0 > 2.0 是数值比，不是字典序）。
# 目录顺序是反的（aaa 在前），排完 [0] 必须是 New。
[[case]]
name = "boot-sort"
covers = ["src/boot/", "patches/", "third_party/sprout"]
ovmf = "release"
timeout_sec = 180
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [{ send = "x", wait_after = 3 }]
expect = ["boot: 2 entries", "boot: [0] New", "boot: [1] Old"]

[[case.extra_volumes]]
  [[case.extra_volumes.files]]
  path = "loader/entries/aaa.conf"
  text = "title Old\nsort-key k\nversion 1.0\nefi /EFI/other/app.efi\n"
  [[case.extra_volumes.files]]
  path = "loader/entries/zzz.conf"
  text = "title New\nsort-key k\nversion 2.0\nefi /EFI/other/app.efi\n"
  [[case.extra_volumes.files]]
  path = "EFI/other/app.efi"
  efi = true


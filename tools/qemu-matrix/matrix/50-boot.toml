# UKI 多 profile：合成 UKI（2 个 profile），只验列出 + 标题区分，不真起。
# 上游 version-sort：新版本在前（third-kernel > second-kernel），故 [0] 是 Second。
[[case]]
name = "boot-uki-profiles"
covers = ["src/boot/", "patches/", "third_party/sprout"]
ovmf = "release"
timeout_sec = 180
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [{ send = "x", wait_after = 3 }]
expect = ["boot: 2 entries", "boot: [0] testos (Second)", "boot: [1] testos (First)"]

[[case.extra_volumes]]
  [[case.extra_volumes.files]]
  path = "EFI/Linux/multi.efi"
  asset = "tools/qemu-matrix/assets/multi-profile.efi"

# 慢：HW bench 落盘工件（默认跳过，--include-slow 才跑）。
[[case]]
name = "hwbench-artifact"
covers = ["src/diag/hw_bench.rs", "src/diag/gop_bench", "src/diag/gop_simd"]
slow = true
timeout_sec = 1500
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "8", wait_for = ["menu: ready"], wait_after = 10 },
]
expect = ["-- bench done --"]
artifact = { glob = "HWBENCH*.TXT", contains = ["ticks"] }


  { send = "0", wait_for = ["boot: 1 entries"], wait_after = 5 },
]
expect = ["boot: [0] OpenCore <efi>", "boot: starting image", { pat = "cfg: version=1", count = 2 }, { pat = "idle: ready", count = 2 }]

[[case.extra_volumes]]
  [[case.extra_volumes.files]]

# crew 上限（`[schedule] cores=2` + workers=all + clip/eager qois：非 slots 适配方，
# 行分区 eager 路）：断言新分发串行 `sched: crew=2/4`（QEMU smp=4 固定 m=4）+
# 旧 `play: path=mp_draw` 字节不变（roles 缺省 auto，不断言 roles 值）。
[[case]]
name = "video-crew-count"
covers = ["src/video/mp.rs", "src/video.rs", "src/config/types.rs", "usb_reports/1080p/video.qois"]
timeout_sec = 180
needs_video = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
feed = "clip"
[playlist]
loop = "loop_list"
[[playlist.items]]
path = "1080p/video.qois"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "all"
cores = 2
"""
boot_expect = ["cfg: version=1", "play.feed=Clip", "idle: ready"]
keys = [{ send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 }, { send = "p", wait_after = 3 }, { send = "0", wait_for = ["menu: ready"], wait_after = 5 }]
expect = ["playlist: items=1 loop=loop_list", "playlist: item 1/1 path=1080p/video.qois", "video: fmt=Qois", "sched: crew=2/4", "play: path=mp_draw"]
soak_sec = 10


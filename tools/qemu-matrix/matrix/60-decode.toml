# 60-decode.toml：QEMU 黑盒矩阵分组（`matrix/` 目录，解码表 + 零拷×多核槽位路径）。
# 共 11 cases（解码 9 + 槽位 2），单文件 ≤1000 行（AGENTS 口径）。
#
# 解码表（`[decode.<fmt>]` 八格式各五键：threads bsp_only/all + zero_copy/streaming 布尔 +
# buffers 0=跟随 tune.window/1-32 显式 + fetch 缺省继承全局 feed）。
# 播放列表化后：`[play] format` 旧键已删除，每例以单项 `[[playlist.items]]`
# 选片（路径自动检测定格式，`play.fmt=` 开机断言随之删除）；断言改为
# 列表行（`playlist: item 1/1 path=`）+ 解析行（`decode: fmt=`）+ 回退/兑现行 +
# 生效行（`video: fmt=`/`video: feed=`）+ path 行 + soak 保活，不断言画质。
# threads=all：qois/raw 无状态即时兑现（`honored (frame-parallel safe)`）；有状态六软解
# （单核顺序状态机）解析但警告并驻 bsp_only。fetch 显式覆盖本格式生效供片
# （`video: feed=` 取覆盖值 + ` fetchovr=<fmt>` 令牌），缺省继承 `[play] feed`；壁纸恒 eager 无视覆盖。
[[case]]
name = "video-decode-hevc"
covers = ["src/video/decoder", "src/video.rs", "src/diag/data/hevc_probe_main.265"]
timeout_sec = 180
needs_hevcvideo = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
feed = "clip"
[playlist]
loop = "loop_list"
[[playlist.items]]
path = "1080p/video.hevc"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
[decode.hevc]
threads = "all"
zero_copy = true
streaming = true
buffers = 8
"""
boot_expect = ["cfg: version=1", "play.feed=Clip", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "0", wait_for = ["menu: ready"], wait_after = 5 },
]
expect = ["playlist: item 1/1 path=1080p/video.hevc", "video: fmt=Hevc", "decode: fmt=Hevc", "decode: Hevc threads all deferred", "play: path=direct_loop"]
soak_sec = 10


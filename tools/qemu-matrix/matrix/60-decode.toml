# 取数覆盖（`[decode.hevc] fetch=stream` 盖全局 feed=clip）：生效 `video: feed=stream` + ` fetchovr=hevc` 令牌；壁纸无视覆盖。
[[case]]
name = "video-decode-fetch-override"
covers = ["src/video/decoder", "src/video.rs", "src/diag/data/hevc_probe_main.265"]
timeout_sec = 180
needs_hevcvideo = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
feed = "clip"
[playlist]
loop = "loop_list"
[[playlist.items]]
path = "1080p/video.hevc"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "bsp_only"
dist = "static"
[decode.hevc]
fetch = "stream"
"""
boot_expect = ["cfg: version=1", "play.feed=Clip", "idle: ready"]
keys = [{ send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 }, { send = "p", wait_after = 3 }, { send = "0", wait_for = ["menu: ready"], wait_after = 5 }]
expect = ["playlist: item 1/1 path=1080p/video.hevc", "video: fmt=Hevc", "video: feed=stream", "decode: fmt=Hevc", "fetchovr=hevc", "play: path=direct_loop"]
soak_sec = 10

# 零拷×多核（qois/raw 帧并行 + workers=all + feed 档走 mp_slots 按核槽位真并行解码；
# BSP scan-split 后按序收槽，独判掉帧）：断言新标记行 + scan 行 + path 行，不断言画质。
[[case]]
name = "video-mp-slots-qois"
covers = ["src/video/mp_slots.rs", "src/video/decoder", "src/video.rs", "usb_reports/1080p/video.qois"]
timeout_sec = 180
needs_video = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
vsync = "off"
[play]
fps = "max"
feed = "zero_copy"
[playlist]
loop = "loop_list"
[[playlist.items]]
path = "1080p/video.qois"
[wallpaper]
enable = false
[schedule]
backend = "manual"
workers = "all"
dist = "static"
"""
boot_expect = ["cfg: version=1", "play.feed=ZeroCopy", "idle: ready"]
keys = [{ send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 }, { send = "p", wait_after = 3 }, { send = "0", wait_for = ["menu: ready"], wait_after = 5 }]
expect = ["playlist: item 1/1 path=1080p/video.qois", "play: path=mp_slots frame-parallel fmt=qois fetch=zero_copy", "mp: slots scan qois chunks=", "video: fmt=Qois"]
soak_sec = 10


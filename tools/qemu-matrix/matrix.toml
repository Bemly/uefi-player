  { send = "1", wait_after = 8 },
  { send = "x", wait_after = 3 },
  { send = "4", wait_after = 8 },
  { send = "x", wait_after = 3 },
  { send = "7", wait_after = 5 },
]
expect = ["Total number of logic processors:", "Starting Multi-Processor", "AVX is "]

# 引导子菜单：b 进 q 回，再按 7 能出数 = 没卡死在子菜单。
[[case]]
name = "boot-menu"
ovmf = "release"
timeout_sec = 180
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
workers = "bsp_only"
dist = "static"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
"""
boot_expect = ["cfg: version=1", "menu: ready"]
# 引导子菜单：b 进（等无项标记）q 回（等返回标记）→ 臂还有一次 pause，
# x 消解 → 7 出数（7 发两次防 flush 吞键，AVX 可重入）。
keys = [
  { send = "b", wait_after = 2 },
  { send = "q", wait_for = ["boot: no entries"], wait_after = 2 },
  { send = "x", wait_for = ["menu: back from b"], wait_after = 2 },
  { send = "7", wait_after = 5 },
  { send = "7", wait_after = 5 },
]
expect = ["AVX is "]

# 壁纸开：2 帧黑场，无缺片警告，菜单照常响应。
[[case]]
name = "wallpaper-on"
timeout_sec = 180
needs_wallpaper = 2
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
workers = "bsp_only"
dist = "static"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = true
fps = 15
"""
boot_expect = ["cfg: version=1", "menu: ready"]
keys = [{ send = "7", wait_after = 5 }]
expect = ["AVX is "]
forbid = ["panicked at", "CpuDeadLoop", "menu bg skipped"]

# 引导 chainload：b 进子菜单（等计数标记）0 选第一项，被起镜像是同一份 efi
# 换个路径（单盘场景）；成功 = 同一串口出现第二遍 cfg + 菜单就绪（计数断言）。
[[case]]
name = "boot-chainload"
ovmf = "release"
timeout_sec = 300
needs_chainload = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
workers = "bsp_only"
dist = "static"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
"""
boot_expect = ["cfg: version=1", "menu: ready"]
keys = [
  { send = "b", wait_after = 2 },
  { send = "0", wait_for = ["boot: 1 entries"], wait_after = 5 },
]
expect = ["boot: starting image", { pat = "cfg: version=1", count = 2 }, { pat = "menu: ready", count = 2 }]

# BLS 组内排序：同 sort-key 下版本号大的在前（10.0 > 2.0 是数值比，不是字典序）。
# 目录顺序是反的（aaa 在前），排完 [0] 必须是 New。
[[case]]
name = "boot-sort"
ovmf = "release"
timeout_sec = 180
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
workers = "bsp_only"
dist = "static"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
"""
boot_expect = ["cfg: version=1", "menu: ready"]
keys = [{ send = "b", wait_after = 3 }]
expect = ["boot: 2 entries", "boot: [0] New", "boot: [1] Old"]

[[case.extra_volumes]]
  [[case.extra_volumes.files]]
  path = "loader/entries/aaa.conf"
  text = "title Old\nsort-key k\nversion 1.0\nefi /EFI/other/app.efi\n"
  [[case.extra_volumes.files]]
  path = "loader/entries/zzz.conf"
  text = "title New\nsort-key k\nversion 2.0\nefi /EFI/other/app.efi\n"
  [[case.extra_volumes.files]]
  path = "EFI/other/app.efi"
  efi = true


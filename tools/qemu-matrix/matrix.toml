name = "async-exec"
timeout_sec = 240
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
workers = "bsp_only"
dist = "static"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "a", wait_for = ["menu: ready"], wait_after = 8 },
]
expect = ["async-exec: nano ok", "async-exec: dynamic ok", "async-exec: PASS"]


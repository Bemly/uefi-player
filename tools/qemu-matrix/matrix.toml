# QEMU 黑盒矩阵：case = 内联 player.toml + 串口断言 + 按键脚本。
# 断言是字面包含匹配（非正则；runner 是纯 Rust std，无 regex 轮子）。
# 新增配置项/路径时在这里加行（和 AGENTS「黑盒矩阵测试」规则配套）。
#
# 固件双轨：`[global] ovmf` 缺省是 brew 瓶 DEBUG OVMF
#（`/usr/local/share/qemu/edk2-x86_64-code.fd`，带 ASSERT，抓固件 bug 用）。
# 单 case 可钉 `ovmf = "release"` 切自带 nightly RELEASE
#（`assets/ovmf-release-x86_64-code.fd`，osdev0/edk2-ovmf-nightly 20261019，
# `build -b RELEASE`，无 ASSERT、更快，适合比性能），可钉 `cpu = "host"`
# 透传宿主特性（缺省 qemu64/SSE2 基线，门禁口径）。
# 命令行 `--ovmf debug|release|PATH` / `--cpu MODEL` 强制全矩阵用一种；
# `--ovmf-set both` 每个 case 跑两遍（第二遍 `-release` 后缀，双轨全绿才算过）。
#
# 分轨口径：`boot-*` 全钉 `ovmf = "release"——引导 lane 用上游实测过的环境
#（sprout 自家 dev 就是发行版 bios.bin，CI 连 QEMU 都不起，见 docs/bootloader.md），
# 后续 `src/boot/` 切上游管线（`resolve_path` 那套）的前提；其余 case 留 debug。

[global]
smp = 4
mem_mb = 1024
ovmf = "/usr/local/share/qemu/edk2-x86_64-code.fd"
timeout_sec = 240
forbid = ["panicked at", "CpuDeadLoop", "No valid frames", "startup_all_aps failed"]

# 新顶层流程（见 `src/idle.rs`）：开机壁纸待机（`idle: ready`）→ 任意键开弹窗
#（`popup: open`）→ 数字键直选引导条目交权 / `p` 进纯播放器菜单（`menu: ready`）
# / `f` 固件设置 / `s` 关机 / `r` 重启 / `q` 回壁纸。无按键 case 只验到待机。
# 冒烟：全显式最快配置，进纯播放器菜单后按 7，AVX 探针必须出数。
[[case]]
name = "menu-smoke"
timeout_sec = 180
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
workers = "bsp_only"
dist = "static"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "7", wait_for = ["menu: ready"], wait_after = 5 },
]
expect = ["AVX is "]

# 矩阵冒烟：全 auto + 2 帧，矩阵行必须出现（赢家不定，不锁）。
# 无按键：只验开机校准（待机即停，不断言菜单）。
[[case]]
name = "matrix-tiny"
timeout_sec = 600
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "auto"
workers = "auto"
dist = "auto"
vsync = "auto"
tune = { frames = 2 }
[play]
fps = "max"
[wallpaper]
enable = false
"""
boot_expect = ["cfg: version=1", "idle: ready"]
expect = ["render auto:"]
forbid = ["panicked at", "CpuDeadLoop"]

# 分工 dynamic 显式：cfg 行必须原样回显（GUI 改 dynamic 落盘即生效的固件侧证明）。
# 无按键：只验开机校准。
[[case]]
name = "matrix-dist-dynamic"
timeout_sec = 180
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
workers = "all"
dist = "dynamic"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
"""
boot_expect = ["cfg: version=1", "idle: ready"]
expect = ["reuse measured"]

# half 定档：冠军计时取半，预算必须落串口。无按键：只验开机校准。
[[case]]
name = "matrix-vsync-half"
timeout_sec = 300
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
workers = "bsp_only"
dist = "static"
vsync = "half"
tune = { frames = 2 }
[play]
fps = "max"
[wallpaper]
enable = false
"""
boot_expect = ["cfg: version=1", "idle: ready"]
expect = ["half probe winner_ticks", "budget"]

# 后缓冲影子环：buffers=2 + auto 单核矩阵（单 cell 经 upload_frame 整推），
# 影子起用行必须出现（无上屏动作时环永不起，这是预期行为）。无按键。
[[case]]
name = "matrix-buffers"
timeout_sec = 180
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "auto"
workers = "bsp_only"
dist = "static"
vsync = "off"
tune = { buffers = 2 }
[play]
fps = "max"
[wallpaper]
enable = false
"""
boot_expect = ["cfg: version=1", "idle: ready"]
expect = ["shadow: 2 bufs", "render auto:"]

# Blt 引擎对照数：选中非 B2V op，单发出数行必须出现（不参选播视频）。
# 无按键：只验开机校准。
[[case]]
name = "matrix-blt-op"
timeout_sec = 300
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "blt"
workers = "bsp_only"
dist = "static"
vsync = "off"
blt_op = "video_to_blt_buffer"
tune = { frames = 2 }
[play]
fps = "max"
[wallpaper]
enable = false
"""
boot_expect = ["cfg: version=1", "idle: ready"]
expect = ["blt_op(VideoToBltBuffer)"]

# 播放多核：弹窗 → p 进纯播放器 → 按 0 进 mp_draw， soak 20 秒只看红线（不断言画面）。

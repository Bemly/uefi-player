forbid = ["panicked at", "CpuDeadLoop", "menu bg skipped"]

# 壁纸 qois：wall.qois 预解码循环（复用测试视频真帧）；弹窗 → p → 7 照常响应。
# 统一 Clip 的 qois 分支在壁纸侧的证明（与 raw 的 wallpaper-on 对称）。
[[case]]
name = "wallpaper-qois"
timeout_sec = 180
needs_wallpaper_qois = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
workers = "bsp_only"
dist = "static"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = true
fps = 15
format = "qois"
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "p", wait_after = 3 },
  { send = "7", wait_for = ["menu: ready"], wait_after = 5 },
]
expect = ["AVX is "]
forbid = ["panicked at", "CpuDeadLoop", "menu bg skipped"]

# 壁纸预载拉满：preload = 0 不封顶（3 帧黑场全进内存，和播片一样）；
# 串口 preloaded 计数即断言。无按键：只验开机预载（待机即停）。
[[case]]
name = "wallpaper-preload-full"
timeout_sec = 120
needs_wallpaper = 3
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
workers = "bsp_only"
dist = "static"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = true
fps = 15
preload = 0
"""
boot_expect = ["cfg: version=1", "idle: ready"]
expect = ["wallpaper: preloaded 3 frames"]

# 引导 chainload：弹窗（等计数标记）0 选第一项，被起镜像是同一份 efi
# 换个路径（单盘场景）；成功 = 同一串口出现第二遍 cfg + 待机就绪（计数断言）。
[[case]]
name = "boot-chainload"
ovmf = "release"
timeout_sec = 300
needs_chainload = true
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
workers = "bsp_only"
dist = "static"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [
  { send = "x", wait_for = ["idle: ready (press any key)"], wait_after = 2 },
  { send = "0", wait_for = ["boot: 1 entries"], wait_after = 5 },
]
expect = ["boot: starting image", { pat = "cfg: version=1", count = 2 }, { pat = "idle: ready", count = 2 }]

# BLS 组内排序：同 sort-key 下版本号大的在前（10.0 > 2.0 是数值比，不是字典序）。
# 目录顺序是反的（aaa 在前），排完 [0] 必须是 New。
[[case]]
name = "boot-sort"
ovmf = "release"
timeout_sec = 180
config = """
version = 1
[accel]
level = "auto"
[render]
mode = "direct"
workers = "bsp_only"
dist = "static"
vsync = "off"
[play]
fps = "max"
[wallpaper]
enable = false
"""
boot_expect = ["cfg: version=1", "idle: ready"]
keys = [{ send = "x", wait_after = 3 }]
expect = ["boot: 2 entries", "boot: [0] New", "boot: [1] Old"]

[[case.extra_volumes]]
  [[case.extra_volumes.files]]
  path = "loader/entries/aaa.conf"
  text = "title Old\nsort-key k\nversion 1.0\nefi /EFI/other/app.efi\n"
  [[case.extra_volumes.files]]
  path = "loader/entries/zzz.conf"
  text = "title New\nsort-key k\nversion 2.0\nefi /EFI/other/app.efi\n"
  [[case.extra_volumes.files]]
  path = "EFI/other/app.efi"
  efi = true


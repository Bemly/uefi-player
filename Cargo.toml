[package]
name = "uefi-player"
version = "26.10.23"
edition = "2024"

[dependencies]
# 视频解码类
less-avc = { version = "0.1.5", default-features = false }
shiguredo_mp4 = { version = "2026.5.0", default-features = false }
# H.264 解码（mp4/壁纸片源用；pure-Rust，no_std 经 `alloc` + `libm`，见 diag/avc_probe.rs 头注释轮子结论；
# 不开上游 `global-alloc`：它会装轮子自带的进程全局分配器，与 uefi 的 `#[global_allocator]` 撞车，
# 上游文档明示自带分配器的下游用 `default-features = false`；
# `asm`（SIMD）开：纯 Rust 可移植内核，host 已证提速（720p census 全进内核，
# baseline 1.55×、main/CABAC 1.23×，与 ffmpeg 像素级一致）；
# 上游 accel 箱无 no_std 门，本仓 submodule pin（third_party/rusty_h264）+ patch 后自 port
# （`default` 为空即 no_std 形，`--features std` 才回上游行为——`common` 的可选
# 依赖边会打开本箱默认特性，默认含 `std` 即链 `std` 死于 E0152，实锤见 vendor VENDOR.md；
# 特性名 census/knobs 与上游一致），经本文件尾部 `[patch.crates-io]` 截到本地
# （version 保持 0.16.1，wide 0.7 不动，global-alloc 保持关闭）。
# `[accel]` 矩阵经 `scalar`=关/`else`=开做单比特开关（见 simd.md）。）
rusty_h264-decoder = { version = "0.16", default-features = false, features = ["libm", "asm"] }
# H.264 SIMD 核直连边（与上条同源，经尾部 `[patch.crates-io]` 同截到本地 vendor 树；
# 传进去的特性为空：`resolve_accel` 的 `set_simd_enabled`/`describe` 调用需要这个 crate 名
# （透传依赖调不到）；`default-features = false` 即 no_std 形，固件侧不链 `std`。
rusty_h264-accel = { version = "0.16", default-features = false }
# H.265 解码（mp4/壁纸片源用；pure-Rust，上游 0.6.2 尚无 no_std 分层，
# 本仓 submodule pin（third_party/rusty_h265）+ patch 后自 port（标量路 + SIMD 双胞胎
# no_std 化，见该目录 VENDOR.md）；纯整数运算，连 libm 都不要。
# `simd` 开：`[accel] level` 做单比特开关（`scalar`=关/其余=开，
# `resolve_accel` 按 `copy_width()` 经轮子自带的 `rusty_h265::accel::`
# 缝推 force 上限，显式超硬件被钳住）。
rusty_h265 = { path = "third_party/rusty_h265/crates/rusty_h265", default-features = false, features = ["simd"] }
# Theora 解码（ogg 片源用；pure-Rust，上游 0.0.12 尚无 no_std 分层，
# 本仓 submodule pin（third_party/oxideav-theora）+ patch 后自 port 标量 decoder-only，
# 见该目录 VENDOR.md；标量 decoder-only + `simd` 下 wide 整数核
# （IDCT butterfly/重建加钳/环路滤波去分支）；`simd` 开：运行时
# `simd::set_simd_enabled` 单比特门，单比特跟随全局 `[accel] level`
# （`scalar`=关/其余=开，无独立开关），关特性时调用即 no-op；
# `default-features = false`
# 即无 std、无 encoder、无 oxideav-core 框架胶水（直接依赖会把 std-only 的
# oxideav-core/serde_json/thiserror 拖进固件，故 vendor + framework 可选）；
# Ogg 页拆帧不在箱内，固件侧手写 OggS 拆帧另立项）。
oxideav-theora = { path = "third_party/oxideav-theora", default-features = false, features = ["simd"] }
# MPEG-2/MPEG-1 视频解码（DVD/广播 TS/MXF-IMX 片源用；pure-Rust clean-room，上游未发
# crates.io 故 submodule pin（third_party/filmcraft）+ patch 后自 port 标量路 + `simd`
# 下整数 SSE2 核（定点 IDCT 行核 + `pavgb` 预测平均），见该目录 VENDOR.md；
# `simd` 开：运行时 `set_simd_enabled` 单比特门，单比特跟随全局 `[accel] level`
# （`scalar`=关/其余=开，无独立开关），关特性时调用即 no-op；
# `default-features = false` 即固件形；
# IDCT 建表用 libm（本仓闭包经 rusty_h264-decoder 已有，复用零新增风险），
# 查表一次化用 spin::Once（core::cell 不 Sync；MIT/MSRV1.38/零传递依赖的新叶子）；
# 精度口径是容差制（max|Δ|≤4、PSNR≥58dB），非 bit-exact，校验和只取 Y 平面）。
filmcraft-mpeg2v = { path = "third_party/filmcraft/crates/mpeg2v", default-features = false, features = ["simd"] }
# VP9 解码（mp4/壁纸片源用；pure-Rust clean-room，上游 0.1.1 尚无 no_std 分层，
# 本仓 submodule pin（third_party/vp9dec）+ patch 后自 port 标量路 + AVX2 整数核（x86_64 常编，
# 无特性门，`avx2_enabled` 运行时门），见该目录 VENDOR.md；
# 零依赖、无 C/FFI、无全局分配器；解码 SIMD 单比特跟随全局 `[accel] level`
# （`scalar`=关/其余=开，`resolve_accel` 按 `copy_width()` 推，无独立开关），
# AVX2 跑前过轮内 CPUID/XCR0 门（含首探幂等自开 XSAVE）；
# 线程并行（tile/loop_filter）恒走顺序路；输出 Y/U/V 三平面行优先）。
vp9dec = { path = "third_party/vp9dec", default-features = false }
# H.263 解码（FLV Sorenson Spark/壁纸片源用；pure-Rust，上游未发 crates.io，
# 本仓 submodule pin（third_party/h263-rs）+ patch 后自 port 标量路 + `simd` 下 wide 整数核，
# 见该目录 VENDOR.md；`simd` 开：`yuv`+`deblock` 两开关同推，
# 单比特跟随全局 `[accel] level`（`scalar`=关/其余=开，无独立开关），
# SSE2 基线无 XSAVE 门；
# 帧输出 planar YUV（DecodedPicture::as_yuv）+ RGBA（yuv420_to_rgba），校验和
# 口径先定死为 md5(Y 平面)+md5(RGBA 输出)，QEMU h263-probe 与 diag 项后继再接。
h263-rs = { path = "third_party/h263-rs/h263", default-features = false }
h263-rs-yuv = { path = "third_party/h263-rs/yuv", default-features = false, features = ["simd"] }
h263-rs-deblock = { path = "third_party/h263-rs/deblock", default-features = false, features = ["simd"] }
# 图像处理类
qoicoubeh = { version = "0.5.0", default-features = false, features = ["alloc"] }
u8g2-fonts = { version = "0.8.0", features = ["embedded_graphics_textstyle"] }
embedded-graphics = "0.8.1"
# 基础框架类（版本与 Sprout 对齐：uefi 0.41.0 / uefi-raw 0.17.0）
uefi = { version = "0.41.0", features = ["logger", "alloc", "global_allocator", "panic_handler"] }
uefi-raw = "0.17.0"
log = "0.4.34"
anyhow = { version = "1.0.104", default-features = false }
# 配置类（与 Sprout 同款；toml 1.x 已支持 no_std；display 给实测回写用）
toml = { version = "1.1.6", default-features = false, features = ["serde", "parse", "display"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
# 信息读取类
raw-cpuid = "11.6.0"
dmidecode = { version = "1.0.0", default-features = false }
# 异步执行器（自家轮子 Bemly/uefi-async，与本仓同 uefi 0.41；未发 crates.io 故走 git；
# default-features=false + 显式堆线：本仓已有 uefi 自带全局分配器在用，
# 不开 uefi-async 的 global-allocator（双全局链接不过）。
# 用法：nano（单核借用节点）/ dynamic-alloc（多核 work-stealing）同词汇；
# static（无堆 Embassy 式）后继早启驱动再按需开。
uefi-async = { version = "26.10", git = "https://github.com/Bemly/uefi-async", package = "uefi-async", default-features = false, features = ["nano-alloc", "alloc"] }
# 扩展键盘输入（自家轮子 Bemly/uefi-input2；EFI_SIMPLE_TEXT_INPUT_EX：
# shift/toggle 状态 + 多键盘 + 按键语义机；未发 crates.io 故走 git；
# default-features=false + alloc：与 uefi-async 同口径）。
uefi-input2 = { version = "41.26", git = "https://github.com/Bemly/uefi-input2", default-features = false, features = ["alloc"] }
# 引导/加载逻辑复用 Sprout（git submodule，pin 原 commit 不 fork）。
# 注意上游 edera-sprout-boot 是纯 bin（无 lib target），path 依赖会被 cargo
# 静默忽略；本仓用 patches/sprout-boot-lib.patch 叠加 [lib]（只加 src/lib.rs +
# [lib] 段，不碰上游逻辑），新 clone 后跑一次
# `git -C third_party/sprout apply ../../patches/sprout-boot-lib.patch` 即可。
edera-sprout-config = { path = "third_party/sprout/crates/config" }
edera-sprout-eficore = { path = "third_party/sprout/crates/eficore" }
edera-sprout-bls = { path = "third_party/sprout/crates/bls" }
edera-sprout-parsing = { path = "third_party/sprout/crates/parsing" }
edera-sprout-boot = { path = "third_party/sprout/crates/boot" }

# Sprout 注释：UEFI target 上低优化会踩优化 pass 的坑，dev 也要 opt-level>=2
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false
strip = true

# vendor 截流：`rusty_h264-decoder`（crates.io，不动）经 `common` 的可选依赖
# 拉到 `rusty_h264-accel`；本仓把该箱 submodule pin（`third_party/rusty_h264`）
# + `patches/rusty_h264-accel.patch` 自 port no_std，在此截到本地
# （`version` 0.16.1 与上游一致；`census`/`knobs` 特性名与上游一致，
# 兼容 `common` 的 `accel?/` 弱依赖；`wide 0.7` 不动；`global-alloc` 保持关闭）。
[patch.crates-io]
rusty_h264-accel = { path = "third_party/rusty_h264/crates/rusty_h264-accel" }
